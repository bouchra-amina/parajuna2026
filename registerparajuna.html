<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Parajuna 2025</title>
    <link rel="stylesheet" href="registerparajuna.css">
</head>
<body>

<main class="container">

    <!-- PARTIE GAUCHE -->
    <section class="left">
        <div class="title-box">
            <h1>PARAJUNA 2025</h1>
        </div>
        <p>Rejoignez un événement médical d'exception dédié à l'apprentissage et à l'innovation.</p>
    </section>

    <!-- PARTIE DROITE -->
    <section class="right">

        <!-- ❗ IMPORTANT: PAS de action / method -->
        <form id="registerForm">

            <h2>Inscription</h2>

            <!-- NOM -->
            <div class="input-group">
                <label for="lastname">Nom</label>
                <input type="text" id="lastname" name="lastname" placeholder="Votre nom" required>
            </div>

            <!-- PRENOM -->
            <div class="input-group">
                <label for="firstname">Prénom</label>
                <input type="text" id="firstname" name="firstname" placeholder="Votre prénom" required>
            </div>

            <!-- EMAIL -->
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="exemple@mail.com" required>
            </div>

            <!-- TELEPHONE -->
            <div class="input-group">
                <label for="phone">Téléphone</label>
                <input type="tel" id="phone" name="phone" placeholder="0555000000" required>
            </div>

            <!-- FILIERE -->
            <div class="input-group">
                <label for="profession">Filière</label>
                <select id="profession" name="profession" required>
                    <option value="" disabled selected hidden>Choisir...</option>
                    <option value="medecine">Médecine</option>
                    <option value="dentaire">Dentaire</option>
                    <option value="pharmacie">Pharmacie</option>
                    <option value="autre">Autre</option>
                </select>
            </div>

            <!-- STATUT / ANNEE (UNE SEULE CASE VISUELLE) -->
            <div class="input-group combined">
                <label>Statut / Année</label>

                <div class="combined-box">

                    <!-- STATUT -->
                    <select id="status" name="status" required>
                        <option value="" disabled selected hidden>Statut</option>
                        <option value="externe">Externe</option>
                        <option value="interne">Interne</option>
                        <option value="resident">Résidant</option>
                        <option value="generaliste">Médecin généraliste</option>
                    </select>

                    <!-- ANNEE -->
                    <select id="year" name="year" required>
                        <option value="" disabled selected hidden>Année</option>
                        <option value="1">1ère année</option>
                        <option value="2">2ème année</option>
                        <option value="3">3ème année</option>
                        <option value="4">4ème année</option>
                        <option value="5">5ème année</option>
                        <option value="6">6ème année</option>
                    </select>

                </div>
            </div>

            <!-- WILAYA -->
            <div class="input-group">
                <label for="wilaya">Wilaya</label>
                <select id="wilaya" name="wilaya" required>
                    <option value="" disabled selected hidden>Choisir votre wilaya...</option>
                    <option value="16 - Alger">16 - Alger</option>
                    <option value="42 - Tipaza">42 - Tipaza</option>
                    <option value="23 - Annaba">23 - Annaba</option>
                </select>
            </div>

            <!-- PROGRAMME -->
            <div class="input-group">
                <label for="program">Programme</label>
                <select id="program" name="program" required>
                    <option value="" disabled selected hidden>Choisir...</option>
                    <option value="conferences">Conférences</option>
                    <option value="ateliers">Ateliers</option>
                    <option value="simulations">Simulations</option>
                    <option value="recherche">Recherche</option>
                </select>
            </div>

            <button type="submit">Valider l'inscription</button>

            <p id="message"></p>

        </form>
    </section>

</main>

<!-- POPUP -->
<div id="popup" class="hidden">
    <div class="popup-content">
        <p id="popupText"></p>
        <button id="closePopup">Génial !</button>
    </div>
</div>

<script src="registerparajuna.js"></script>
</body>
</html>
